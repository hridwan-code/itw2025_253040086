<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog retro games | HRIDPLAY</title>
    <link rel="stylesheet" href="../../css/5hc/latihan5hc.css">
    <link rel="stylesheet" href="../../css/5hc/latihan5hc2.css">
    <link rel="stylesheet" href="../../css/5hc/navbar.css">
</head>
<body>
    <nav class="navbar">
        <h1>HRIDPLAY</h1>
    </nav>
    <div class="hero"></div>

    <!-- pencarian -->
    <div class="search-box">
    <input type="text" placeholder="Cari sesuatu..." />
    <button class="search-btn" aria-label="Cari">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
        <circle cx="11" cy="11" r="7"
        stroke="currentColor" stroke-width="1.6"/>
        <line x1="16.65" y1="16.65" x2="21" y2="21"
        stroke="currentColor" stroke-width="1.6"/>
    </svg>
</button>
    </div> 
    <!-- deskripsi pencarian -->
    <p class="search-desc">
        HRIDPLAY
    </p>
    <h2 class="search-desc2">temukan berbagai game retro yang anda sukai</h2>
    </div>

    <div class="katalogsatu">
        <div class="gambarsatu">
            <img src="img/Castlevania.png" alt="Castlevania">
            <p class="judulcover">Castlevania</p>
        </div>
        <div class="gambardua">
            <img src="img/doom.jpg" alt="doom">
            <p class="judulcover">Doom</p>
        </div>
        <div class="gambartiga">
            <img src="img/space.jpg" alt="space">
            <p class="judulcover">Space</p>
        </div>
        <div class="gambarempat">
            <img src="img/Donkeykong.png" alt="Donkeykong">
            <p class="judulcover">Donkeykong</p>
        </div>
        <div class="gambarlima">
            <img src="img/xmen.jpg" alt="xmen">
            <p class="judulcover">Xmen</p>
        </div>
    </div>
    <div class="katalogdua">
        <div class="gambarenam">    
            <img src="img/gradius.jpg" alt="gradius">
            <p class="judulcover">Gradius</p>
        </div>
        <div class="gambartujuh">
            <img src="img/street-fighter.jpg" alt="streetfighter">
            <p class="judulcover">Street Fighter</p>
        </div>
        <div class="gambardelapan">
            <img src="img/zelda.jpg" alt="zelda">   
            <p class="judulcover">Zelda</p>
        </div>
        <div class="gambarsembilan">
            <img src="img/contra.jpg" alt="contra">
            <p class="judulcover">Contra</p>
        </div>
        <div class="gambarsepuluh">
            <img src="img/berzerk.png" alt="berzerk">
            <p class="judulcover">Berzerk</p>
        </div>
    </div>
</body>
</html>
