<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightbox</title>
    <link rel="stylesheet" href="lightbox.css">
</head>
<body>
    <p class="judul">Art Classics</p>
<div class="container"></div>
    <div class="gambar">
    <div class="foto">
        <a href="#lukisansatu">
            <img src="img/lukisansatu.jpg" alt="lukisan satu">
        </a>
        <p class="namaatas">Napoleon</p>
        <p class="namabawah">Bonaparte</p>
    </div>
    <div class="foto1">
        <a href="#lukisandua">
            <img src="img/lukisandua.jpg" alt="lukisan dua">
        </a>
        <p class="namaatas1">Girl With</p>
        <p class="namabawah1">A Pearl Earring</p>
    </div>
    <div class="foto2">
        <a href="#lukisantiga">
            <img src="img/lukisantiga.jpg" alt="lukisan tiga">
        </a>
        <p class="namaatas2">Mona</p>
        <p class="namabawah2">Lisa</p>
    </div>
    <div class="foto3">
        <a href="#lukisanempat">
            <img src="img/lukisanempat.jpg" alt="lukisan empat">
        </a>
        <p class="namaatas3">Vincent</p>
        <p class="namabawah3">Van Gogh</p>
    </div>
    <!-- lightbox -->
    <div class="overlay" id="lukisansatu">
        <a href="#" class="close"></a> 
        <img src="img/lukisansatu.jpg" alt="lukisan satu">
    </div>
    <div class="overlay2" id="lukisandua">
        <a href="#" class="closedua"></a> 
        <img src="img/lukisandua.jpg" alt="lukisan dua">
    </div>
    <div class="overlay3" id="lukisantiga">
        <a href="#" class="closetiga"></a>
        <img src="img/lukisantiga.jpg" alt="lukisan tiga">
    </div>
    <div class="overlay4" id="lukisanempat">
        <a href="#" class="closeempat"></a>
        <img src="img/lukisanempat.jpg" alt="lukisan empat">
    </div>
</div>
</body>
</html>
